name: Showroom functional acceptance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: showroom-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  showroom-acceptance:
    if: github.event.pull_request.number == 84 && github.head_ref == 'feat/showroom-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SHOWROOM_ACCEPTANCE_CONTAINER: supabase_db_aladdin_pr84_ci
      SHOWROOM_ACCEPTANCE_ENV_FILE: ${{ runner.temp }}/showroom-acceptance.env
      SHOWROOM_ACCEPTANCE_SCREENSHOT_DIR: ${{ github.workspace }}/.artifacts/showroom/screenshots
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter frontend exec playwright install --with-deps chromium
      - name: Record exact candidate and configure runner-only stack
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/showroom-acceptance-ci.mjs configure
      - name: Start isolated Supabase and replay complete history
        run: |
          pnpm exec supabase start --exclude studio,postgres-meta,realtime,imgproxy,edge-runtime,logflare,vector,supavisor
          pnpm exec supabase db reset
          pnpm exec supabase status -o json > "$RUNNER_TEMP/showroom-status.json"
          node scripts/showroom-acceptance-ci.mjs verify
      - name: Build exact candidate application
        run: pnpm --filter frontend build > .artifacts/showroom/build.log 2>&1
      - name: Desktop and mobile functional acceptance
        run: |
          set -o pipefail
          pnpm --filter frontend exec playwright test --config playwright.showroom-auth.config.ts 2>&1 | tee .artifacts/showroom/browser.log
      - name: Collect safe diagnostics
        if: always()
        run: node scripts/showroom-acceptance-ci.mjs diagnostics
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showroom-acceptance-${{ github.event.pull_request.head.sha }}
          path: .artifacts/showroom/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop only this runner's isolated stack
        if: always()
        run: |
          if grep -q '^project_id = "aladdin_pr84_ci"$' supabase/config.toml; then
            timeout 90s pnpm exec supabase stop --no-backup
          fi
