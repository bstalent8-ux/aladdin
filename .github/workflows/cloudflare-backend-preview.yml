# Aladdin - FastAPI backend PREVIEW on Cloudflare Containers (ADR-0022), Approval B.
#
# Builds backend/Dockerfile and deploys edge/backend-worker's `preview` environment: Worker
# `aladdin-backend-preview`, no workers.dev address and no route, container `basic` in WEUR, at most
# 2 instances. It talks to the isolated acceptance Supabase project only (nxossqhdfltcqdwvbewi) and never
# touches DNS, aladdindecore.com, the live Supabase project or any Production resource.
#
# SAFE BY DEFAULT: nothing is deployed unless the GitHub Environment `cloudflare-preview` has the variable
# CLOUDFLARE_BACKEND_PREVIEW_ENABLED set to exactly "true". Without it the run builds and bundles only.
#
# GitHub Environment `cloudflare-preview` (shared with the frontend preview):
#   secrets:   CLOUDFLARE_API_TOKEN   (this account only: Workers Scripts:Edit plus Containers:Edit)
#   variables: CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_BACKEND_PREVIEW_ENABLED,
#              NEXT_PUBLIC_SUPABASE_ANON_KEY (optional; the acceptance anon key, a public value)
# The only Worker secret the preview needs is SUPABASE_ANON_KEY, and that is the acceptance project's public
# anon key, so the run uploads it with the version. No service-role key, DATABASE_URL or R2 key is used.
#
# Rollback: remove the BACKEND binding from frontend/wrangler.jsonc and redeploy the frontend preview, then
# `pnpm --dir edge/backend-worker exec wrangler delete --env preview`. Neither touches data.
#
# Runs on pushes to the PR #98 branch: GitHub only offers the manual button for workflows on the default
# branch, and this one stays off `main` until the preview is accepted.

name: Cloudflare backend preview

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-ea9qxg]
    paths: ["backend/**", "edge/backend-worker/**", ".github/workflows/cloudflare-backend-preview.yml"]

concurrency:
  group: cloudflare-backend-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    name: cloudflare-backend-preview
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    env:
      # aladdin-r2-acceptance (nxossqhdfltcqdwvbewi) unless the environment overrides it.
      ACCEPTANCE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54b3NzcWhkZmx0Y3Fkd3ZiZXdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MjYxMjMsImV4cCI6MjEwNzMwMjEyM30.bhRRGiQK3astY9HTAUKlQBtPKuqKvPGbOycoVo9QT64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm (corepack, pinned to packageManager)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - name: Refuse anything but the acceptance project
        working-directory: edge/backend-worker
        run: |
          node -e '
            const t = require("fs").readFileSync("wrangler.jsonc", "utf8");
            const preview = t.slice(t.indexOf("\"preview\": {"), t.indexOf("\"production\": {"));
            if (!preview.includes("https://nxossqhdfltcqdwvbewi.supabase.co")) { console.error("preview SUPABASE_URL is not the acceptance project"); process.exit(1); }
            if (preview.includes("kkpkgjrweysgvhvkhzun")) { console.error("preview must never point at the live project"); process.exit(1); }'
          # The key must be accepted by the acceptance project itself (works for a legacy JWT anon key and a
          # new sb_publishable_ key alike); a key from any other project gets 401 here.
          case "$ACCEPTANCE_ANON_KEY" in sb_secret_*|"") echo "SUPABASE_ANON_KEY must be the acceptance anon/publishable key"; exit 1 ;; esac
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $ACCEPTANCE_ANON_KEY" \
            https://nxossqhdfltcqdwvbewi.supabase.co/auth/v1/settings)
          [ "$status" = "200" ] || { echo "SUPABASE_ANON_KEY is not accepted by the acceptance project (HTTP $status)"; exit 1; }
      - run: pnpm install --frozen-lockfile --filter @aladdin/backend-worker
      - run: pnpm --dir edge/backend-worker test
      - name: Bundle (dry run, builds the image)
        working-directory: edge/backend-worker
        run: pnpm exec wrangler deploy --env preview --dry-run --outdir "$RUNNER_TEMP/worker"
      - name: Deploy aladdin-backend-preview
        if: vars.CLOUDFLARE_BACKEND_PREVIEW_ENABLED == 'true'
        working-directory: edge/backend-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          umask 077
          node -e 'process.stdout.write(JSON.stringify({ SUPABASE_ANON_KEY: process.env.ACCEPTANCE_ANON_KEY }))' > "$RUNNER_TEMP/secrets.json"
          pnpm exec wrangler deploy --env preview --secrets-file "$RUNNER_TEMP/secrets.json" | tee "$RUNNER_TEMP/deploy.log"
          rm -f "$RUNNER_TEMP/secrets.json"
      - name: Show the container application
        if: vars.CLOUDFLARE_BACKEND_PREVIEW_ENABLED == 'true'
        working-directory: edge/backend-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler containers list || true
