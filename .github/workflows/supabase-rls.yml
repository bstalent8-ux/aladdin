# Aladdin — Supabase RLS / tenant-isolation security gate.
#
# Starts the local Supabase stack, applies every migration from a clean database,
# runs the seed, lints the public/app schemas, and executes the full pgTAP suite
# (tenant isolation, membership lifecycle, branch isolation, public-discovery
# projection safety, platform-admin boundary, audit immutability, privilege
# hardening). Any migration, lint, or test failure fails the PR.
#
# Stable status-check name for branch protection: `supabase-rls`.
#
# Runner assumptions:
#   - ubuntu-latest ships Docker; `supabase start` runs the stack in containers.
#   - The Supabase CLI is the repo-pinned devDependency (package.json: supabase
#     2.110.0), invoked via `pnpm exec supabase` — no third-party action to vet.
#   - No cloud credentials and no live Supabase project are used; everything is
#     local to the runner. The stack is always stopped in cleanup.
#   - Expected duration ~5-9 min (most of it the one-time Docker image pulls).

name: supabase-rls

on:
  pull_request:
    branches: [main]
  # Manual runs on stacked release branches (their PRs do not target main yet).
  workflow_dispatch:

concurrency:
  group: supabase-rls-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read-only checkout, no secrets.
permissions:
  contents: read

jobs:
  supabase-rls:
    name: supabase-rls
    runs-on: ubuntu-latest
    # The destructive concurrency scripts never auto-select a database (supabase/tests/lib/db_target.sh): they need an
    # explicit target. This runner is a throwaway VM with exactly one stack (the CLI default project id `aladdin`), so it
    # names that container and explicitly opts in to the shared-stack name. Never set these on a developer machine.
    env:
      DB_CONTAINER: supabase_db_aladdin
      ALLOW_SHARED_STACK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm (corepack, pinned to packageManager)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      # Installs the repo-pinned Supabase CLI (devDependency) into the workspace.
      - run: pnpm install --frozen-lockfile

      - name: Self-test the destructive-test target guard (no Docker, no writes)
        run: bash supabase/tests/lib/db_target_selftest.sh

      - name: Verify exact RC2 upgrade and atomic function permissions
        run: |
          node scripts/prepare-media-integration-replay.mjs upgrade
          pnpm exec supabase start --workdir logs/rc2-media-upgrade
          node scripts/migration-permission-gate.mjs supabase_db_aladdin_r2_rc2_upgrade postgres upgrade
          PERMISSION_TEST_CONTAINER=supabase_db_aladdin_r2_rc2_upgrade node --test scripts/migration-permission-gate.test.mjs
          node --test scripts/media-storage.test.mjs
          pnpm exec supabase stop --workdir logs/rc2-media-upgrade --no-backup

      - name: Start local Supabase stack
        run: pnpm exec supabase start

      - name: Apply all migrations from a clean database (+ seed)
        run: pnpm exec supabase db reset

      - name: Lint public/app schemas
        run: pnpm exec supabase db lint --schema public,app

      - name: Verify fresh effective function permissions
        run: node scripts/migration-permission-gate.mjs supabase_db_aladdin postgres check

      - name: Run pgTAP tenant-isolation / RLS tests
        run: pnpm exec supabase test db

      - name: Verify authoritative business-phone metadata matches the application
        run: node scripts/test-business-phone-parity.mjs --container supabase_db_aladdin --database postgres

      - name: Prove last-owner safety with concurrent transactions
        run: bash supabase/tests/last_owner_concurrency_test.sh

      - name: Prove concurrent approval is serialized and immutable
        run: bash supabase/tests/account_approval_concurrency_test.sh

      - name: Prove lead transitions are optimistic-locked (no lost update)
        run: bash supabase/tests/lead_transition_concurrency_test.sh

      - name: Prove the installer phone-change journal (and its coexistence with secondary phones) under simultaneous requests
        run: bash supabase/tests/installer_phone_change_concurrency_test.sh

      - name: Prove repeatability (second clean reset + tests)
        run: |
          pnpm exec supabase db reset
          node scripts/migration-permission-gate.mjs supabase_db_aladdin postgres check
          pnpm exec supabase test db

      # Always stop the stack, even if an earlier step failed.
      - name: Stop local Supabase stack
        if: always()
        run: |
          pnpm exec supabase stop --workdir logs/rc2-media-upgrade --no-backup || true
          pnpm exec supabase stop --no-backup || true
