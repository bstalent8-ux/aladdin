# Aladdin — minimum PR validation CI.
#
# Runs on pull requests into the protected `main` and on pushes to `main`.
# Uses ONLY official GitHub actions (checkout / setup-node / setup-python),
# with corepack (bundled with Node) for pnpm and pipx (preinstalled on runners)
# for the uv tool — so there are no third-party actions to vet.
#
# Stable status-check job names for branch protection: `frontend`, `backend`, `docs`,
# and `migration-policy` (PRs only; add it to the ruleset's required checks once merged).
# Hardening follow-ups (documented in docs/technical/TECHNICAL_DEBT.md):
#   - pin actions to full commit SHAs;
#   - add Docker image build + Supabase RLS/isolation jobs once reliable in CI.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read-only, no secrets used.
permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    # Real Redis for the cache-isolation, rate-limit and job-lock tests (ADR-0019).
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm (corepack, pinned to packageManager)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend typecheck
      - run: pnpm --filter frontend lint
      - run: pnpm --filter frontend test
      - run: pnpm --filter frontend build
      # Media Worker (edge/media-worker): unit tests with fake R2/database bindings, no Cloudflare account.
      - run: pnpm --filter @aladdin/media-worker typecheck
      - run: pnpm --filter @aladdin/media-worker test

  # The same app built for Cloudflare Workers (OpenNext, ADR-0021). Builds and bundles only:
  # no Cloudflare account, no deploy. Catches anything that breaks the Workers runtime build.
  frontend-cloudflare:
    name: frontend-cloudflare
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_ENV: staging
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # wrangler 4 requires Node 22
      - name: Enable pnpm (corepack, pinned to packageManager)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend cf:build
      - name: Bundle the Worker (dry run, no upload) and keep it under the 64 MiB limit
        working-directory: frontend
        run: pnpm exec wrangler deploy --env preview --dry-run --outdir "$RUNNER_TEMP/worker"
      # next.config.ts swaps server/storage/image-processing/runtime.ts for runtime.workers.ts
      # (Cloudflare Images binding) when ALADDIN_BUILD_TARGET=workers, set by open-next.config.ts.
      - name: The Worker bundle must not contain sharp, and must use the Images engine
        working-directory: frontend
        run: |
          # Bundled code only (worker.js and OpenNext's handler); copied package sources may mention sharp in messages.
          if grep -lE "sharp-linux|@img/sharp|node_modules/sharp/" "$RUNNER_TEMP/worker/worker.js" .open-next/server-functions/default/frontend/handler.mjs; then
            echo "sharp leaked into the Worker bundle"; exit 1
          fi
          if ! grep -q 'cloudflare-images' "$RUNNER_TEMP/worker/worker.js"; then
            echo "the Worker bundle does not carry the Cloudflare Images engine (image-processing/runtime.workers.ts)"; exit 1
          fi

  backend:
    name: backend
    runs-on: ubuntu-latest
    # Real Redis for the cache-isolation, rate-limit and job-lock tests (ADR-0019).
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv (tool bootstrap; project deps stay uv-managed)
        run: pipx install uv
      # ffmpeg for the real transcode test of the video worker (ADR-0020).
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: uv sync --frozen --python 3.12 --group video-worker
      - run: uv run ruff check .
      - run: uv run --group video-worker pytest

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Internal markdown link check
        run: python scripts/check_doc_links.py
      - name: No tracked dependency/build/secret files
        run: |
          if git ls-files \
            | grep -E '(^|/)(node_modules|\.next|out|dist|build|coverage|\.turbo|\.cache|\.venv|__pycache__|\.pytest_cache|\.ruff_cache|\.mypy_cache)/|(^|/)\.env($|\.)' \
            | grep -v '\.env\.example'; then
            echo "::error::tracked dependency/build/secret file(s) found"; exit 1
          fi
          echo "no tracked dependency/build/secret files"
      - name: No .pen file tracked
        run: |
          if git ls-files | grep -E '\.pen$'; then
            echo "::error::a .pen file is tracked (must be gitignored)"; exit 1
          fi
          echo "no .pen files tracked"
      - name: No merge-conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> )' -- . ; then
            echo "::error::merge-conflict markers found"; exit 1
          fi
          echo "no conflict markers"

  # Pull requests only. A review aid for `supabase/migrations`: see scripts/migration-policy.mjs and the
  # expand/contract rules in docs/operations/staging-deployment-runbook.md. It also runs the unit tests of the
  # migration-history guard and the Vercel deployment selector that the staging deploy workflow depends on.
  migration-policy:
    name: migration-policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The media-storage script tests load sharp from the frontend workspace.
      - name: Enable pnpm (corepack, pinned to packageManager)
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (migration-history guard, migration policy, deployment selector, media storage)
        run: node --test scripts/*.test.mjs
      - name: Review the migrations changed by this PR
        run: |
          git diff --name-status --no-renames "$BASE_SHA"...HEAD -- supabase/migrations > "$RUNNER_TEMP/migration-changes.txt"
          git ls-tree -r --name-only "$BASE_SHA" -- supabase/migrations > "$RUNNER_TEMP/migration-base-files.txt"
          node scripts/migration-policy.mjs \
            --changes "$RUNNER_TEMP/migration-changes.txt" \
            --base-files "$RUNNER_TEMP/migration-base-files.txt"
