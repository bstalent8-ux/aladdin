# ===========================================================================
# The 26 STAGING demo accounts — the single source of truth for the manifest,
# the email remap, and the automated validator.
#
# This file describes accounts that ALREADY EXIST in the seed files. It never
# creates one. Every `id` here is a deterministic UUID owned by
# supabase/seed.sql or supabase/seed-pilot.sql, and the validator fails if this
# list and `auth.users` ever disagree — so an account cannot be added to a seed
# without being described here, or described here without existing.
#
# It deliberately holds NO email addresses. `slug` is the only email-shaped
# value, and it is a local-part fragment, not an address: the deliverable
# address is composed at build time from the owner's own configured mailbox
# (supabase/staging/demo-email.toml — gitignored). See demo-email.example.toml.
#
# Fields
#   id        deterministic UUID from the seed files (never changed)
#   slug      email tag fragment; must be unique, [a-z0-9-] only
#   name      display name as seeded into profiles.display_name
#   persona   users.primary_account_type, or "" for a business-only identity
#   org       organizations.name, or "" for an identity with no organization
#   org_type  organizations.org_type for `org`
#   role      the RELATIONSHIP to the organization (owner/manager/member) or the
#             personal standing — never an account type
#   landing   the route the app resolves for this account (see the note below)
#   data      the key rows this account can actually see, under RLS
#   demo      what to show a client from this account
#
# LANDING is DERIVED, not configured. `landingFor()` in
# frontend/src/lib/workspace/model.ts resolves it, and with no workspace cookie
# set an identity that has BOTH a personal persona and an active membership
# lands on /home — its business workspace is one click away in the workspace
# switcher. That is why several org members below land on /home, not /b2b.
# ===========================================================================

